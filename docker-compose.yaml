
services:
  wise-task-event-db:
    image: timescale/timescaledb:2.26.0-pg16
    container_name: ${EVENT_DB_APP_NAME}
    ports:
      - "127.0.0.1:${EVENT_DB_PORT}:${EVENT_DB_PORT}"
    environment:
      POSTGRES_USER: ${EVENT_DB_USER}
      POSTGRES_PASSWORD: ${EVENT_DB_PASSWORD}
      POSTGRES_DB: ${EVENT_DB}
      POSTGRES_PORT: ${EVENT_DB_PORT}
    volumes:
      - wise-task-event-db:/var/lib/postgresql/data
    command: postgres -p ${EVENT_DB_PORT}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U wise_task_event -d wise_task_event" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always

  wise-task-event:
    build:
      context: ../wise-task-event
      dockerfile: Dockerfile
      tags:
        - 'wise-task-event'
      network: host
    container_name: ${EVENT_APP_NAME}
    depends_on:
      - wise-task-event-db
    ports:
      - "127.0.0.1:${EVENT_GRPC_PORT}:${EVENT_GRPC_PORT}"
      - "127.0.0.1:${EVENT_PORT}:${EVENT_PORT}"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - EVENT_GRPC_PORT=${EVENT_GRPC_PORT}
      - EVENT_PORT=${EVENT_PORT}
      - EVENT_DB_USER=${EVENT_DB_USER}
      - EVENT_DB_PASSWORD=${EVENT_DB_PASSWORD}
      - EVENT_DB=${EVENT_DB}
      - CACHE_SPEC=${CACHE_SPEC}
      - TIME_TO_LIVE_SECONDS=${TIME_TO_LIVE_SECONDS}
      - LOGGING_LEVEL=${GRAPH_LOGGING_LEVEL}

  wise-task-db:
    image: postgres:17-alpine3.22
    container_name: ${DB_APP_NAME}
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USER}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - wise-task-db:/var/lib/postgresql/data
      - ./docker/postgres/init-scripts:/docker-entrypoint-initdb.d

  wise-task-mongo:
    image: mongo:7.0.31
    container_name: ${MONGO_APP_NAME}
    ports:
      - "127.0.0.1:${MONGO_PORT}:${MONGO_PORT}"
    volumes:
      - wise-task-mongo:/data/db

  wise-task-graph:
    build:
      context: ../wise-task-graph
      dockerfile: Dockerfile
      tags:
        - 'wise-task-graph'
      args:
        - USERNAME=${USERNAME}
        - TOKEN=${TOKEN}
      network: host
    image: 'wise-task-graph'
    depends_on:
      - wise-task-mongo
    container_name: ${GRAPH_APP_NAME}
    ports:
      - "127.0.0.1:${GRAPH_GRPC_PORT}:${GRAPH_GRPC_PORT}"
      - "127.0.0.1:${GRAPH_PORT}:${GRAPH_PORT}"
    environment:
      - MANAGEMENT_METRICS_ENABLE_PROCESS=false
      - SPRING_PROFILES_ACTIVE=prod
      - LOKI_HOST=${LOKI_HOST}
      - LOKI_PORT=${LOKI_PORT}
      - TEMPO_HOST=${TEMPO_HOST}
      - TEMPO_PORT=${TEMPO_PORT}
      - MONGO_APP_NAME=${MONGO_APP_NAME}
      - MONGO_PORT=${MONGO_PORT}
      - MONGO_DB=${MONGO_DB}
      - GRAPH_PORT=${GRAPH_PORT}
      - GRAPH_GRPC_PORT=${GRAPH_GRPC_PORT}

  wise-task-plugin:
    build:
      context: ../wise-task-plugin
      dockerfile: Dockerfile
      args:
        - USERNAME=${USERNAME}
        - TOKEN=${TOKEN}
      tags:
        - 'wise-task-plugin'
      network: host
    image: 'wise-task-plugin'
    depends_on:
      - wise-task-db
      - wise-task-task
      - wise-task-graph
    container_name: ${PLUGIN_APP_NAME}
    ports:
      - "127.0.0.1:${PLUGIN_GRPC_PORT}:${PLUGIN_GRPC_PORT}"
      - "127.0.0.1:${PLUGIN_PORT}:${PLUGIN_PORT}"
    environment:
      - MANAGEMENT_METRICS_ENABLE_PROCESS=false
      - SPRING_PROFILES_ACTIVE=prod
      - LOKI_HOST=${LOKI_HOST}
      - LOKI_PORT=${LOKI_PORT}
      - TEMPO_HOST=${TEMPO_HOST}
      - TEMPO_PORT=${TEMPO_PORT}
      - PLUGIN_DB=${PLUGIN_DB}
      - PLUGIN_DB_USER=${PLUGIN_DB_USER}
      - PLUGIN_DB_PASSWORD=${PLUGIN_DB_PASSWORD}
      - PLUGIN_PATH=${PLUGIN_PATH}
      - PLUGIN_PORT=${PLUGIN_PORT}
      - LOGGING_LEVEL=${PLUGIN_LOGGING_LEVEL}
      - PLUGIN_VALIDATION_LIMIT=${PLUGIN_VALIDATION_LIMIT}
      - GRAPH_APP_NAME=${GRAPH_APP_NAME}
      - GRAPH_GRPC_PORT=${GRAPH_GRPC_PORT}

  wise-task-profile:
    build:
      context: ../wise-task-profile
      dockerfile: Dockerfile
      args:
        - USERNAME=${USERNAME}
        - TOKEN=${TOKEN}
      tags:
        - 'wise-task-profile'
      network: host
    image: 'wise-task-profile'
    depends_on:
      - wise-task-db
    container_name: wise-task-profile
    ports:
      - "127.0.0.1:${PROFILE_PORT}:${PROFILE_PORT}"
      - "127.0.0.1:${PROFILE_GRPC_PORT}:${PROFILE_GRPC_PORT}"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - LOKI_HOST=${LOKI_HOST}
      - LOKI_PORT=${LOKI_PORT}
      - TEMPO_HOST=${TEMPO_HOST}
      - TEMPO_PORT=${TEMPO_PORT}
      - DB=${DB_APP_NAME}
      - LOGGING_LEVEL=${PROFILE_LOGGING_LEVEL}
      - PROFILE_GRPC_PORT=${PROFILE_GRPC_PORT}
      - PROFILE_PORT=${PROFILE_PORT}
      - PROFILE_DB=${PROFILE_DB}
      - PROFILE_DB_USER=${PROFILE_DB_USER}
      - PROFILE_DB_PASSWORD=${PROFILE_DB_PASSWORD}

  wise-task-task:
    build:
      context: ../wise-task-task
      dockerfile: Dockerfile
      args:
        - USERNAME=${USERNAME}
        - TOKEN=${TOKEN}
      tags:
        - 'wise-task-task'
      network: host
    image: 'wise-task-task'
    depends_on:
      - wise-task-db
      - wise-task-graph
    container_name: ${TASK_APP_NAME}
    ports:
      - "127.0.0.1:${TASK_GRPC_PORT}:${TASK_GRPC_PORT}"
      - "127.0.0.1:${TASK_PORT}:${TASK_PORT}"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - LOKI_HOST=${LOKI_HOST}
      - LOKI_PORT=${LOKI_PORT}
      - TEMPO_HOST=${TEMPO_HOST}
      - TEMPO_PORT=${TEMPO_PORT}
      - LOGGING_LEVEL=${TASK_LOGGING_LEVEL}
      - DB=${DB_APP_NAME}
      - TASK_GRPC_PORT=${TASK_GRPC_PORT}
      - TASK_PORT=${TASK_PORT}
      - TASK_DB=${TASK_DB}
      - TASK_DB_USER=${TASK_DB_USER}
      - TASK_DB_PASSWORD=${TASK_DB_PASSWORD}
      - PLUGIN_APP_NAME=${PLUGIN_APP_NAME}
      - PLUGIN_GRPC_PORT=${PLUGIN_GRPC_PORT}
      - GRAPH_APP_NAME=${GRAPH_APP_NAME}
      - GRAPH_GRPC_PORT=${GRAPH_GRPC_PORT}

  wise-task-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - USERNAME=${USERNAME}
        - TOKEN=${TOKEN}
      tags:
        - 'wise-task-gateway'
      network: host
    image: 'wise-task-gateway'
    depends_on:
      - wise-task-profile
      - wise-task-task
      - wise-task-plugin
      - wise-task-graph
    container_name: ${GATEWAY_APP_NAME}
    ports:
      - "127.0.0.1:${GATEWAY_PORT}:${GATEWAY_PORT}"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - LOKI_HOST=${LOKI_HOST}
      - LOKI_PORT=${LOKI_PORT}
      - TEMPO_HOST=${TEMPO_HOST}
      - TEMPO_PORT=${TEMPO_PORT}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - CORS_ALLOWED_METHODS=${CORS_ALLOWED_METHODS}
      - CORS_ALLOWED_CREDENTIALS=${CORS_ALLOWED_CREDENTIALS}
      - CORS_MAX_AGE=${CORS_MAX_AGE}
      - JWT_EXPIRATION_SEC=${JWT_EXPIRATION_SEC}
      - LOGGING_LEVEL=${GATEWAY_LOGGING_LEVEL}
      - GATEWAY_PORT=${GATEWAY_PORT}
      - GRAPH_APP_NAME=${GRAPH_APP_NAME}
      - GRAPH_GRPC_PORT=${GRAPH_GRPC_PORT}
      - TASK_APP_NAME=${TASK_APP_NAME}
      - TASK_GRPC_PORT=${TASK_GRPC_PORT}
      - PROFILE_APP_NAME=${PROFILE_APP_NAME}
      - PROFILE_GRPC_PORT=${PROFILE_GRPC_PORT}
      - PLUGIN_APP_NAME=${PLUGIN_APP_NAME}
      - PLUGIN_GRPC_PORT=${PLUGIN_GRPC_PORT}
      - EVENT_APP_NAME=${EVENT_APP_NAME}
      - EVENT_GRPC_PORT=${EVENT_GRPC_PORT}
    volumes:
      - ./src/main/resources/application-prod.yaml:/app/config/application-prod.yaml:ro
      - ./src/main/resources/application-dev.yaml:/app/config/application-dev.yaml:ro

  tempo:
    image: grafana/tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./docker/tempo/tempo-local.yml:/etc/tempo.yaml
      - ./docker/tempo/tempo-data:/tmp/tempo
    ports:
      - "127.0.0.1:3200:3200"
      - "127.0.0.1:9411:9411"  # Zipkin
      - "127.0.0.1:14268:14268" # Jaeger ingest
  loki:
    image: grafana/loki
    command: [ "-config.file=/etc/loki/local-config.yaml" ]
    ports:
      - "127.0.0.1:3100:3100"
    environment:
      - JAEGER_AGENT_HOST=${TEMPO_HOST}
      - JAEGER_ENDPOINT=http://${TEMPO_HOST}:14268/api/traces
      - JAEGER_SAMPLER_TYPE=const
      - JAEGER_SAMPLER_PARAM=1

  prometheus:
    image: prom/prometheus
    extra_hosts: [ 'host.docker.internal:host-gateway' ]
    command:
      - --enable-feature=exemplar-storage
      - --config.file=/etc/prometheus/prometheus.yml
    depends_on:
      - loki
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "127.0.0.1:9090:9090"

  smtp:
    image: boky/postfix
    container_name: smtp-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:25:25"
    environment:
      - SMTP_SERVER_HOSTNAME=localhost
      - SMTP_SERVER_DOMAIN=wisetask.ru
      - RELAY_NETWORKS=0.0.0.0/0
      - POSTFIX_mailbox_command=/bin/cat
      - ALLOWED_SENDER_DOMAINS=wisetask.ru
      - LOG_TO_STDOUT=1
    hostname: mail

  grafana:
    image: grafana/grafana
    volumes:
      - ./docker/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./docker/grafana/dashboards:/etc/grafana/dashboards
      - ./docker/grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_AUTH_BASIC_ENABLED="false"
      - GF_AUTH_DISABLE_LOGIN_FORM="true"
      - GF_AUTH_DISABLE_SIGNOUT_MENU="true"
      - GF_AUTH_PROXY_ENABLED="true"
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - loki
      - prometheus
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  wise-task-mongo: {}
  metadata_data: {}
  middle_var: {}
  historical_var: {}
  broker_var: {}
  coordinator_var: {}
  router_var: {}
  druid_shared: {}
  wise-task-db: {}
  wise-task-event-db: {}
